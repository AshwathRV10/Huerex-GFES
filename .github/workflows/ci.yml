name: CI

# Runs the same three checks a contributor runs locally, so a regression is
# caught on the pull request rather than on somebody's machine after merge.
on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run still going for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # Both TypeScript projects: the app, and the server it talks to.
      - name: Typecheck
        run: npm run typecheck

      # The costing maths against a hand-worked example, and the production
      # engine against the imported workbook — including that
      # Cut = Shipped + Rejected + WIP balances for every order.
      - name: Test
        run: npm test

      # Catches what typecheck cannot: bad imports, CSS, bundling.
      - name: Build
        run: npm run build
