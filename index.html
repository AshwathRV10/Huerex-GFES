<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f5f2" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Fonts ship with the app, so nothing is fetched from the internet.
         Only the latin faces are preloaded; the extended ones load if a
         character needs them. -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>HUEREX GFES · Factory Execution & Costing</title>
    <script>
      // Apply the stored theme before first paint so there is no flash.
      try {
        var t = localStorage.getItem('huerex.theme');
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
